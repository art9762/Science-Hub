[project]
name = "science-hub"
version = "0.1.0"
description = "Local AI workspace for engineering and research projects"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1",
  "python-dotenv>=1,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "Pillow>=11,<13",
  "reportlab>=4,<5",
  "pytesseract>=0.3.13,<1",
  "PyMuPDF>=1.25,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

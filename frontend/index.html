<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#162a29" />
    <meta
      name="description"
      content="Science Hub — локальное рабочее пространство для исследований и инженерных проектов"
    />
    <script>
      try {
        const theme = localStorage.getItem("science-hub-theme");
        document.documentElement.dataset.theme = theme === "light" || theme === "dark"
          ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {}
    </script>
    <title>Science Hub · Исследовательская среда</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
